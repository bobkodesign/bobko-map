<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>카카오맵 키 테스트</title>
<style>
  #status { font-family: sans-serif; font-size: 16px; padding: 12px; background: #fffae0; }
  #map { width: 100%; height: 400px; }
</style>
</head>
<body>
<div id="status">로딩 중...</div>
<div id="map"></div>

<script>
  document.getElementById('status').textContent = '스크립트 태그 삽입 시작...';
</script>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=9728ad66892290e622fe57d1cb396bc4&autoload=false"
  onerror="document.getElementById('status').textContent = '❌ SDK 스크립트 자체를 불러오지 못했습니다 (네트워크/도메인 차단 가능성)';"
></script>
<script>
  window.addEventListener('load', function() {
    if (typeof kakao === 'undefined') {
      document.getElementById('status').textContent = '❌ kakao 객체가 정의되지 않음 (도메인 미등록 또는 키 오류 가능성 높음)';
      return;
    }
    document.getElementById('status').textContent = 'kakao 객체 확인됨, maps.load 호출 중...';
    kakao.maps.load(function() {
      document.getElementById('status').textContent = '✅ 카카오맵 정상 로드 성공!';
      const map = new kakao.maps.Map(document.getElementById('map'), {
        center: new kakao.maps.LatLng(37.7074, 126.7491),
        level: 9
      });
    });
  });
</script>
</body>
</html>
